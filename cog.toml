branch_whitelist = ["main", "next"]
pre = "next.*"
skip_ci = "[skip ci]"
skip_untracked = false
pre_bump_hooks = []
post_bump_hooks = []
pre_package_bump_hooks = []
post_package_bump_hooks = []
tag_prefix = "v"

[git_hooks]

[commit_types]

[changelog]
path = "CHANGELOG.md"
template = "meta/changelog/changelog.tera"
remote = "github.com"
repository = "reuse-lint-action"
owner = "Imamiland"
authors = [
